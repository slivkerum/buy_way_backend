version: '3.8'

services:
  buy-way-postgres:
    container_name: buy-way-postgres
    image: postgres:14
    restart: always
    volumes:
      - buy_way_postgres_data:/var/lib/postgresql/data
    env_file:
      - .local.env
    ports:
      - "1313:5432"
    networks:
      - backend

  buy-way-redis:
    image: redis:7
    container_name: buy-way-redis
    restart: always
    volumes:
      - buy_way_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend

  buy-way-backend:
    container_name: buy-way-backend
    build:
      context: ../src
      dockerfile: Dockerfile
    restart: always
    command: "sh /entrypoint.sh"
    volumes:
      - socket:/app/sockets/
      - static:/app/static
      - ../src:/app
    env_file:
      - .local.env
    networks:
      - backend
    depends_on:
      - buy-way-postgres
      - buy-way-redis

  buy-way-nginx:
    container_name: buy-way-nginx
    restart: always
    build:
      context: ../nginx
      dockerfile: Dockerfile
    env_file:
      - .local.env
    volumes:
      - socket:/files/socket
      - static:/files/django_staticfiles:ro
    ports:
      - "8000:8080"
    networks:
      - backend
    depends_on:
      - buy-way-backend

volumes:
  buy_way_postgres_data:
  buy_way_redis_data:
  static:
  socket:

networks:
  backend:
