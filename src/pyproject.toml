[tool.poetry]
name = "bay-way"
version = "1.0.0"
description = ""
authors = ["Dmitriy <https://github.com/slivkerum>"]
license = "Apache License"
readme = "README.md"
packages = [
    { include = "apps" },
]

[tool.poetry.dependencies]
python = "3.12.7"
django = "5.1.7"
punq = "0.7.0"
django-environ = "^0.12.0"
python-jose = "^3.4.0"
psycopg2-binary = "^2.9.10"
pre-commit = "^3.6.2"
django-phonenumber-field = "^8.0.0"
phonenumbers = "^8.13.52"
uwsgi = "2.0.29"
django-redis = "^5.4.0"
django-ninja = "1.3.0"
djoser = "^2.3.1"
drf-yasg = "^1.21.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true
force_grid_wrap = 2
src_paths = ["core", ]
skip_glob = [
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_django = ["django", "ninja"]
known_first_party = ["core"]
sections = [
    "FUTURE",
    "STDLIB",
    "DJANGO",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

